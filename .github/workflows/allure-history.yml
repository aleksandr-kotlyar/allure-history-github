name: Allure History GitHub

on:
  workflow_call:
    inputs:
      environment:
        description: Report environment folder under public/.
        required: false
        type: string
        default: dev
      group-path:
        description: Relative report group; empty uses environment/branch.
        required: false
        type: string
        default: ""
      pages-branch:
        description: Branch used to store generated Pages content and Allure history.
        required: false
        type: string
        default: gh-pages
      reports-to-keep:
        description: Number of immutable report snapshots kept per report group.
        required: false
        type: number
        default: 30
      allure-results-artifact:
        description: Artifact name containing allure-results/.
        required: false
        type: string
        default: allure-results
      job-id-artifact:
        description: Optional artifact name containing a jobid file.
        required: false
        type: string
        default: jobid
      pages-base-url:
        description: Optional explicit Pages base URL. When empty, the workflow infers the standard GitHub Pages URL.
        required: false
        type: string
        default: ""
      comment-pr:
        description: Post or update a pull request comment with the immutable report URL.
        required: false
        type: boolean
        default: false
      pull-request-number:
        description: Pull request number to comment on when comment-pr is enabled.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: allure-history-github-pages
  cancel-in-progress: false

jobs:
  publish-allure-history:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.allure-results-artifact }}
          path: allure-results

      - name: Download optional job id
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ inputs.job-id-artifact }}
          path: .artifacts/jobid

      - name: Build and persist Allure history
        id: report
        uses: $/
        with:
          environment: ${{ inputs.environment }}
          group-path: ${{ inputs.group-path }}
          pages-branch: ${{ inputs.pages-branch }}
          reports-to-keep: ${{ inputs.reports-to-keep }}
          pages-base-url: ${{ inputs.pages-base-url }}
          comment-pr: ${{ inputs.comment-pr }}
          pull-request-number: ${{ inputs.pull-request-number }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.report.outputs.public-dir }}

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
